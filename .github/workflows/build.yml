name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project (any zip in repo, or loose files)
        shell: bash
        run: |
          set -e
          echo "--- files in repo ---"
          find . -not -path "./.git/*" -type f | head -50

          rm -rf extracted
          mkdir extracted

          ZIP="$(find . -maxdepth 2 -not -path './.git/*' -iname '*.zip' -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"

          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -o "$ZIP" -d extracted
          else
            echo "No zip found, using loose files from the repo"
            tar --exclude=./.git --exclude=./extracted -cf - . | tar -xf - -C extracted
          fi

          SPEC_FILE="$(find extracted -name buildozer.spec -type f -print -quit)"
          if [ -z "$SPEC_FILE" ]; then echo "buildozer.spec NOT FOUND"; exit 1; fi

          sed -i '/^\[app\]/a p4a.branch = v2024.01.21\nandroid.ndk = 25b' "$SPEC_FILE"

          echo "PROJECT_DIR=$(dirname "$SPEC_FILE")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$SPEC_FILE")"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cython==0.29.36" virtualenv buildozer

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoxClaimer-APK
          path: extracted/**/bin/*.apk
          if-no-files-found: error
